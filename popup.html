<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font:14px system-ui,sans-serif;width:300px;margin:0;padding:16px;color:#202124}
h1{font-size:16px;margin:0 0 5px}p{color:#5f6368;font-size:12px;line-height:1.4;margin:0 0 13px}
button{width:100%;padding:10px;margin:4px 0;border:0;border-radius:7px;background:#1a73e8;color:#fff;font-weight:600;cursor:pointer}
button.secondary{background:#eef3fd;color:#174ea6}button:disabled{opacity:.55;cursor:wait}
#status{min-height:18px;margin-top:9px;color:#5f6368;font-size:12px;line-height:1.4}
a{display:inline-block;margin:10px 12px 0 0;color:#1a73e8;font-size:12px}
.history{border-top:1px solid #eee;margin-top:13px;padding-top:10px}
.history h2{font-size:13px;margin:0 0 7px}.item{font-size:11px;color:#5f6368;padding:4px 0;overflow-wrap:anywhere}
</style></head>
<body>
<h1>LocalShot</h1>
<p>Images are assembled in your browser and saved through Chrome Downloads. Nothing is uploaded.</p>
<button data-mode="full">Capture full page</button>
<button class="secondary" data-mode="visible">Capture visible screen</button>
<button class="secondary" data-mode="area">Select an area to capture</button>
<div id="status" role="status"></div>
<div class="history"><h2>Recent screenshots</h2><div id="history"></div></div>
<a href="options.html" target="_blank">Settings</a><a href="chrome://extensions/shortcuts" target="_blank">Keyboard shortcuts</a>
<script src="popup.js"></script></body></html>
